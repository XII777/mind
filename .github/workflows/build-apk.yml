name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-key.jks

      - name: Set version from build number
        id: version
        run: |
          VERSION_CODE=${{ github.run_number }}
          VERSION_NAME="1.2.${VERSION_CODE}"
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${VERSION_CODE}/" pubspec.yaml
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Building version ${VERSION_NAME}+${VERSION_CODE}"

      - name: Install dependencies
        run: flutter pub get

      - name: Build split-per-ABI release APKs
        env:
          KEYSTORE_FILE: release-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --split-per-abi

      - name: Get commit info
        id: commit
        run: |
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "author=$(git log -1 --pretty=%an)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%B %d, %Y')" >> $GITHUB_OUTPUT

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peace-mind-v${{ steps.version.outputs.version_name }}-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGES="- Initial release"
          else
            CHANGES=$(git log "${PREV_TAG}..HEAD" --no-merges \
              --pretty=format:"- %s" \
              | grep -vE "^- (chore|docs|ci|style|test|build)(\(.*\))?:" \
              | head -30)
            [ -z "$CHANGES" ] && CHANGES="- Bug fixes and improvements"
          fi
          {
            echo "CHANGES<<EOFDIFF"
            echo "$CHANGES"
            echo "EOFDIFF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "🧠 Peace Mind v${{ steps.version.outputs.version_name }}"
          prerelease: true
          generate_release_notes: false
          files: build/app/outputs/flutter-apk/*.apk
          body: |
            <div align="center">

            <img src="https://img.icons8.com/color/96/brain.png" width="64"/>

            # Peace Mind
            ### v${{ steps.version.outputs.version_name }} · Pre-release Build

            *Built on ${{ steps.commit.outputs.date }} · Commit [`${{ steps.commit.outputs.sha }}`](https://github.com/XII777/mind/commit/${{ steps.commit.outputs.sha }})*

            </div>

            ---

            ## <img src="https://img.icons8.com/color/28/downloading-updates.png" width="22" align="absmiddle"/> Download & Install

            Pick the APK for your device — click the filename to download directly:

            | APK | Device | Download |
            |-----|--------|----------|
            | `app-arm64-v8a-release.apk` | <img src="https://img.icons8.com/color/20/checkmark.png" width="16" align="absmiddle"/> Most modern Android phones **(recommended)** | [<img src="https://img.icons8.com/color/20/download.png" width="16" align="absmiddle"/> Download](https://github.com/XII777/mind/releases/download/v${{ steps.version.outputs.version_name }}/app-arm64-v8a-release.apk) |
            | `app-armeabi-v7a-release.apk` | <img src="https://img.icons8.com/color/20/smartphone.png" width="16" align="absmiddle"/> Older / 32-bit phones | [<img src="https://img.icons8.com/color/20/download.png" width="16" align="absmiddle"/> Download](https://github.com/XII777/mind/releases/download/v${{ steps.version.outputs.version_name }}/app-armeabi-v7a-release.apk) |
            | `app-x86_64-release.apk` | <img src="https://img.icons8.com/color/20/laptop.png" width="16" align="absmiddle"/> Emulators & x86 devices | [<img src="https://img.icons8.com/color/20/download.png" width="16" align="absmiddle"/> Download](https://github.com/XII777/mind/releases/download/v${{ steps.version.outputs.version_name }}/app-x86_64-release.apk) |

            <img src="https://img.icons8.com/color/20/idea.png" width="16" align="absmiddle"/> **Updating?** Tap the APK → choose **Update** — do **not** uninstall first. Your data is preserved.

            <img src="https://img.icons8.com/color/20/error.png" width="16" align="absmiddle"/> **Accessibility permission** is revoked by Android after every update (Android 9+ security policy). Re-enable at **Settings → Accessibility → Peace Mind** after installing.

            ---

            ## <img src="https://img.icons8.com/color/28/new.png" width="22" align="absmiddle"/> Changes in this build

            ${{ steps.changelog.outputs.CHANGES }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
